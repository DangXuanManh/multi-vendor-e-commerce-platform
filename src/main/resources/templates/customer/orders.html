<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Đơn Hàng Của Tôi')}"></head>
<body>
    <div th:replace="~{layout/main :: navbar}"></div>
    <div th:replace="~{layout/main :: alerts}"></div>

    <div class="container main-content mt-5">
        <h3 class="fw-bold mb-4"><i class="fa-solid fa-clock-rotate-left me-2 text-primary"></i>Lịch Sử Đơn Hàng Của Tôi</h3>

        <div th:if="${orders.isEmpty()}" class="card border-0 shadow-sm rounded-4 text-center py-5 bg-white">
            <i class="fa-solid fa-box-open display-1 text-muted mb-3"></i>
            <h5 class="text-muted">Bạn chưa có đơn hàng nào!</h5>
            <div class="mt-3">
                <a href="/products" class="btn btn-primary rounded-pill px-4">Mua sắm ngay</a>
            </div>
        </div>

        <div th:if="${!orders.isEmpty()}" class="d-flex flex-column gap-3">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white" th:each="order : ${orders}">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
                    <div>
                        <span class="fw-bold fs-5 me-3">Đơn hàng #<span th:text="${order.id}">1</span></span>
                        <small class="text-muted" th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}">Date</small>
                    </div>
                    <div>
                        <span class="badge fs-6"
                              th:classappend="${order.status.name() == 'DELIVERED' ? 'bg-success' : (order.status.name() == 'CANCELLED' ? 'bg-danger' : 'bg-warning text-dark')}"
                              th:text="${order.status}">PENDING</span>
                    </div>
                </div>

                <div class="row align-items-center">
                    <div class="col-md-8">
                        <div class="d-flex align-items-center gap-3 mb-2" th:each="item : ${order.items}">
                            <img th:src="${item.product.imageUrl}" class="rounded-2" style="width: 40px; height: 40px; object-fit: cover;" alt="Product">
                            <div>
                                <span class="fw-bold text-dark" th:text="${item.product.name}">Product Name</span>
                                <small class="text-muted ms-2">(Shop: <span th:text="${item.shop.name}">Shop</span> x<span th:text="${item.quantity}">1</span>)</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 text-md-end mt-3 mt-md-0">
                        <p class="mb-1 text-muted small">Tổng tiền:</p>
                        <h4 class="text-danger fw-bold mb-2" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</h4>
                        <a th:href="@{/customer/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary rounded-pill">Xem chi tiết <i class="fa-solid fa-angle-right ms-1"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/main :: footer}"></div>
</body>
</html>
