<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Giỏ Hàng Đa Nhà Bán')}"></head>
<body>
    <div th:replace="~{layout/main :: navbar}"></div>
    <div th:replace="~{layout/main :: alerts}"></div>

    <div class="container main-content mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0"><i class="fa-solid fa-cart-shopping me-2 text-primary"></i>Giỏ Hàng Của Bạn</h3>
            <form th:if="${cart != null and !cart.items.isEmpty()}" action="/cart/clear" method="post" onsubmit="return confirm('Xóa toàn bộ giỏ hàng?');">
                <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill">
                    <i class="fa-solid fa-trash-can me-1"></i>Xóa Toàn Bộ Giỏ Hàng
                </button>
            </form>
        </div>

        <!-- Empty Cart -->
        <div th:if="${cart == null or cart.items.isEmpty()}" class="card border-0 shadow-sm rounded-4 text-center py-5 bg-white">
            <i class="fa-solid fa-cart-arrow-down display-1 text-muted mb-3"></i>
            <h4 class="text-muted fw-normal">Giỏ hàng của bạn đang trống!</h4>
            <div class="mt-3">
                <a href="/products" class="btn btn-primary rounded-pill px-4"><i class="fa-solid fa-bag-shopping me-2"></i>Mua sắm ngay</a>
            </div>
        </div>

        <!-- Cart Has Items -->
        <div th:if="${cart != null and !cart.items.isEmpty()}" class="row g-4">
            <!-- Left Side: Items Grouped by Vendor Shop -->
            <div class="col-lg-8">
                <div th:each="entry : ${cart.itemsGroupedByShop}" class="card border-0 shadow-sm rounded-4 p-3 bg-white mb-4">
                    <!-- Vendor Shop Header -->
                    <div class="d-flex align-items-center gap-2 border-bottom pb-3 mb-3">
                        <i class="fa-solid fa-shop text-primary fs-5"></i>
                        <h5 class="fw-bold mb-0 me-2" th:text="${entry.key.name}">Tên Cửa Hàng</h5>
                        <a th:href="@{/shops/{id}(id=${entry.key.id})}" class="btn btn-sm btn-light rounded-pill px-3">Ghé Shop <i class="fa-solid fa-angle-right ms-1"></i></a>
                    </div>

                    <!-- Products from this Shop -->
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Sản Phẩm</th>
                                    <th>Đơn Giá</th>
                                    <th style="width: 140px;">Số Lượng</th>
                                    <th>Thành Tiền</th>
                                    <th class="text-end">Xóa</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${entry.value}">
                                    <td>
                                        <div class="d-flex align-items-center gap-3">
                                            <img th:src="${item.product.imageUrl}" class="rounded-3" style="width: 50px; height: 50px; object-fit: cover;" alt="Product">
                                            <div>
                                                <a th:href="@{/products/{id}(id=${item.product.id})}" class="text-decoration-none text-dark fw-bold" th:text="${item.product.name}">Tên sản phẩm</a>
                                                <div class="small text-muted" th:if="${item.product.category != null}" th:text="${item.product.category.name}">Danh mục</div>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="fw-bold" th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</td>
                                    <td>
                                        <form action="/cart/update" method="post" class="d-flex gap-1 align-items-center">
                                            <input type="hidden" name="productId" th:value="${item.product.id}">
                                            <input type="number" name="quantity" class="form-control form-control-sm text-center" th:value="${item.quantity}" min="1" th:max="${item.product.stockQuantity}" style="width: 65px;">
                                            <button type="submit" class="btn btn-sm btn-outline-primary" title="Cập nhật số lượng"><i class="fa-solid fa-check"></i></button>
                                        </form>
                                    </td>
                                    <td class="text-danger fw-bold" th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</td>
                                    <td class="text-end">
                                        <form th:action="@{/cart/remove/{id}(id=${item.product.id})}" method="post">
                                            <button type="submit" class="btn btn-sm btn-outline-danger border-0" title="Xóa món này"><i class="fa-solid fa-trash"></i></button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Right Side: Order Summary -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white sticky-top" style="top: 90px;">
                    <h5 class="fw-bold mb-3">Tóm Tắt Đơn Hàng</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Tổng số gian hàng:</span>
                        <span class="fw-bold" th:text="${cart.itemsGroupedByShop.size()} + ' Shop'">1 Shop</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Tổng số món:</span>
                        <span class="fw-bold" th:text="${cart.totalQuantity} + ' sản phẩm'">0</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4 fs-5">
                        <span class="fw-bold">Tổng thanh toán:</span>
                        <span class="text-danger fw-bold" th:text="${#numbers.formatDecimal(cart.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</span>
                    </div>

                    <a href="/checkout" class="btn btn-danger btn-lg w-100 rounded-pill fw-bold shadow-sm">
                        <i class="fa-solid fa-credit-card me-2"></i>Tiến Hành Đặt Hàng
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/main :: footer}"></div>
</body>
</html>
