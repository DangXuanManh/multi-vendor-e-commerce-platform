<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Trang Quản Trị Sàn - Admin')}"></head>
<body>
    <div th:replace="~{layout/main :: navbar}"></div>
    <div th:replace="~{layout/main :: alerts}"></div>

    <div class="container main-content mt-4">
        <!-- Admin Header -->
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 bg-dark text-white">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-danger text-white rounded-circle p-3 fs-2">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold mb-0">Hệ Thống Quản Trị Sàn TMĐT</h3>
                        <small class="text-light-50">Chào mừng Quản trị viên hệ thống</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <ul class="nav nav-pills mb-4 gap-2">
            <li class="nav-item">
                <a class="nav-link active rounded-pill px-4" href="/admin/dashboard"><i class="fa-solid fa-chart-line me-2"></i>Tổng Quan</a>
            </li>
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/vendors"><i class="fa-solid fa-store me-2 text-primary"></i>Duyệt Cửa Hàng</a>
            </li>
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/categories"><i class="fa-solid fa-layer-group me-2 text-success"></i>Danh Mục Sản Phẩm</a>
            </li>
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/users"><i class="fa-solid fa-users me-2 text-warning"></i>Người Dùng</a>
            </li>
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/orders"><i class="fa-solid fa-receipt me-2 text-danger"></i>Toàn Bộ Đơn Hàng</a>
            </li>
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/settings"><i class="fa-solid fa-gear me-2 text-secondary"></i>Cấu Hình Website</a>
            </li>
        </ul>

        <!-- Metric Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white text-center">
                    <i class="fa-solid fa-sack-dollar text-success fs-1 mb-2"></i>
                    <p class="text-muted mb-1 fw-bold">Tổng Doanh Thu Sàn</p>
                    <h4 class="fw-bold text-success" th:text="${#numbers.formatDecimal(totalPlatformRevenue, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">0 VNĐ</h4>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white text-center">
                    <i class="fa-solid fa-store text-primary fs-1 mb-2"></i>
                    <p class="text-muted mb-1 fw-bold">Shop Đã Duyệt</p>
                    <h4 class="fw-bold text-primary" th:text="${totalShops}">0</h4>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white text-center">
                    <i class="fa-solid fa-clock text-warning fs-1 mb-2"></i>
                    <p class="text-muted mb-1 fw-bold">Shop Chờ Duyệt</p>
                    <h4 class="fw-bold text-warning" th:text="${pendingShops}">0</h4>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white text-center">
                    <i class="fa-solid fa-users text-danger fs-1 mb-2"></i>
                    <p class="text-muted mb-1 fw-bold">Tổng Tài Khoản</p>
                    <h4 class="fw-bold text-danger" th:text="${totalUsers}">0</h4>
                </div>
            </div>
        </div>

    </div>

    <div th:replace="~{layout/main :: footer}"></div>
</body>
</html>
