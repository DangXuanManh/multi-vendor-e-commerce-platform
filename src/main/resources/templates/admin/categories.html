<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Quản Lý Danh Mục - Admin')}"></head>
<body>
    <div th:replace="~{layout/main :: navbar}"></div>
    <div th:replace="~{layout/main :: alerts}"></div>

    <div class="container main-content mt-4">
        <!-- Navigation Tabs -->
        <ul class="nav nav-pills mb-4 gap-2">
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/dashboard"><i class="fa-solid fa-chart-line me-2 text-info"></i>Tổng Quan</a>
            </li>
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/vendors"><i class="fa-solid fa-store me-2 text-primary"></i>Duyệt Cửa Hàng</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active rounded-pill px-4" href="/admin/categories"><i class="fa-solid fa-layer-group me-2"></i>Danh Mục Sản Phẩm</a>
            </li>
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/users"><i class="fa-solid fa-users me-2 text-warning"></i>Người Dùng</a>
            </li>
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/orders"><i class="fa-solid fa-receipt me-2 text-danger"></i>Toàn Bộ Đơn Hàng</a>
            </li>
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/settings"><i class="fa-solid fa-gear me-2 text-secondary"></i>Cấu Hình Website</a>
            </li>
        </ul>

        <div class="row g-4">
            <!-- Add New Category Form -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <h5 class="fw-bold mb-3 text-primary"><i class="fa-solid fa-plus-circle me-2"></i>Thêm Danh Mục Mới</h5>
                    <form action="/admin/categories/save" method="post" th:object="${newCategory}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên danh mục *</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="Tên danh mục" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mô tả</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Mô tả danh mục..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">URL Hình Ảnh</label>
                            <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="https://example.com/icon.jpg">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill"><i class="fa-solid fa-floppy-disk me-1"></i>Lưu Danh Mục</button>
                    </form>
                </div>
            </div>

            <!-- Categories List Table -->
            <div class="col-md-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-list me-2"></i>Danh Sách Danh Mục</h5>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Hình Ảnh</th>
                                    <th>Tên Danh Mục</th>
                                    <th>Mô Tả</th>
                                    <th class="text-end">Xóa</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cat : ${categories}">
                                    <td th:text="${cat.id}">1</td>
                                    <td>
                                        <img th:src="${cat.imageUrl}" class="rounded-circle" style="width: 40px; height: 40px; object-fit: cover;" alt="Cat Image">
                                    </td>
                                    <td class="fw-bold" th:text="${cat.name}">Category Name</td>
                                    <td class="small text-muted" th:text="${cat.description}">Description</td>
                                    <td class="text-end">
                                        <form th:action="@{/admin/categories/delete/{id}(id=${cat.id})}" method="post" onsubmit="return confirm('Bạn có chắc muốn xóa danh mục này?');">
                                            <button type="submit" class="btn btn-sm btn-outline-danger border-0"><i class="fa-solid fa-trash"></i></button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/main :: footer}"></div>
</body>
</html>
