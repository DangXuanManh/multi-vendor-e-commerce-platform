<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Cấu Hình Website - Admin')}"></head>
<body>
    <div th:replace="~{layout/main :: navbar}"></div>
    <div th:replace="~{layout/main :: alerts}"></div>

    <div class="container main-content mt-4">
        <!-- Admin Header -->
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 bg-dark text-white">
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-danger text-white rounded-circle p-3 fs-2">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold mb-0">Hệ Thống Quản Trị Sàn TMĐT</h3>
                        <small class="text-light-50">Cấu hình thông tin hoạt động Website</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <ul class="nav nav-pills mb-4 gap-2">
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/dashboard"><i class="fa-solid fa-chart-line me-2 text-info"></i>Tổng Quan</a>
            </li>
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/vendors"><i class="fa-solid fa-store me-2 text-primary"></i>Duyệt Cửa Hàng</a>
            </li>
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/categories"><i class="fa-solid fa-layer-group me-2 text-success"></i>Danh Mục Sản Phẩm</a>
            </li>
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/users"><i class="fa-solid fa-users me-2 text-warning"></i>Người Dùng</a>
            </li>
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/orders"><i class="fa-solid fa-receipt me-2 text-danger"></i>Toàn Bộ Đơn Hàng</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active rounded-pill px-4" href="/admin/settings"><i class="fa-solid fa-gear me-2"></i>Cấu Hình Website</a>
            </li>
        </ul>

        <!-- Website Settings Form -->
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-5">
            <h4 class="fw-bold mb-4 text-primary"><i class="fa-solid fa-sliders me-2"></i>Thiết Lập Thông Tin Website</h4>

            <form action="/admin/settings" method="post" th:object="${setting}">
                <input type="hidden" th:field="*{id}">

                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Tên Sàn / Website *</label>
                        <input type="text" th:field="*{siteName}" class="form-control" placeholder="Ví dụ: Sàn TMĐT Đa Nhà Bán" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">URL Logo Website</label>
                        <input type="url" th:field="*{logoUrl}" class="form-control" placeholder="https://domain.com/logo.png">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Email Hỗ Trợ Khách Hàng</label>
                        <input type="email" th:field="*{contactEmail}" class="form-control" placeholder="support@domain.com">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Hotline / Số Điện Thoại Hỗ Trợ</label>
                        <input type="text" th:field="*{contactPhone}" class="form-control" placeholder="1900 1234">
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-bold">Địa Chỉ Trụ Sở Chính</label>
                        <input type="text" th:field="*{address}" class="form-control" placeholder="Số nhà, đường, quận/huyện, thành phố...">
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-bold">Nội Dung Tiêu Đề Banner Trang Chủ (Hero Banner)</label>
                        <textarea th:field="*{heroBannerText}" class="form-control" rows="2" placeholder="Nội dung chào mừng tại trang chủ..."></textarea>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-bold">Nội Dung Bảng Bản Quyền Chân Trang (Footer Copyright)</label>
                        <input type="text" th:field="*{footerText}" class="form-control" placeholder="© 2026 JVTech Marketplace. All rights reserved.">
                    </div>

                    <div class="col-12">
                        <div class="form-check form-switch p-3 border rounded-3 bg-light">
                            <input class="form-check-input ms-0 me-3" type="checkbox" role="switch" id="maintenanceSwitch" th:field="*{maintenanceMode}">
                            <label class="form-check-label fw-bold text-danger" for="maintenanceSwitch">
                                <i class="fa-solid fa-triangle-exclamation me-1"></i>Bật Chế Độ Bảo Trì Website (Maintenance Mode)
                            </label>
                            <div class="small text-muted ms-5">Khi bật, chỉ có tài khoản ADMIN mới có thể truy cập hệ thống.</div>
                        </div>
                    </div>
                </div>

                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 fw-bold shadow-sm">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Lưu Cấu Hình
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{layout/main :: footer}"></div>
</body>
</html>
