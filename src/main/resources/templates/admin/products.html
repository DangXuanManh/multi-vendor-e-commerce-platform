<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head('Quản Lý Sản Phẩm - Admin')}"></head>
<body>
    <div th:replace="~{layout/main :: navbar}"></div>
    <div th:replace="~{layout/main :: alerts}"></div>

    <div class="container main-content mt-4">
        <!-- Navigation Tabs -->
        <ul class="nav nav-pills mb-4 gap-2">
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/dashboard"><i class="fa-solid fa-chart-line me-2 text-info"></i>Tổng Quan</a>
            </li>
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/vendors"><i class="fa-solid fa-store me-2 text-primary"></i>Duyệt Cửa Hàng</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active rounded-pill px-4" href="/admin/products"><i class="fa-solid fa-box-open me-2"></i>Quản Lý Sản Phẩm</a>
            </li>
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/categories"><i class="fa-solid fa-layer-group me-2 text-success"></i>Danh Mục Sản Phẩm</a>
            </li>
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/users"><i class="fa-solid fa-users me-2 text-warning"></i>Người Dùng</a>
            </li>
            <li class="nav-item">
                <a class="nav-link bg-white text-dark shadow-sm rounded-pill px-4" href="/admin/orders"><i class="fa-solid fa-receipt me-2 text-danger"></i>Toàn Bộ Đơn Hàng</a>
            </li>
        </ul>

        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0"><i class="fa-solid fa-boxes-stacked me-2 text-primary"></i>Danh Sách Sản Phẩm Hệ Thống (<span th:text="${products.size()}">0</span>)</h4>
            </div>

            <div class="table-responsive">
                <table class="table align-middle table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Ảnh</th>
                            <th>Tên Sản Phẩm</th>
                            <th>Danh Mục</th>
                            <th>Shop / Seller</th>
                            <th>Giá Bán</th>
                            <th>Tồn Kho</th>
                            <th>Trạng Thái</th>
                            <th class="text-end">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${products}">
                            <td th:text="${p.id}">1</td>
                            <td>
                                <img th:src="${p.imageUrl}" class="rounded border p-1" style="width: 48px; height: 48px; object-fit: cover;" alt="Prod">
                            </td>
                            <td class="fw-bold">
                                <a th:href="@{/products/{id}(id=${p.id})}" class="text-decoration-none text-slate-900" th:text="${p.name}">Product Name</a>
                            </td>
                            <td><span class="badge bg-light text-dark border" th:text="${p.category.name}">Category</span></td>
                            <td th:text="${p.shop.name}">Shop Name</td>
                            <td class="fw-bold text-primary" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</td>
                            <td th:text="${p.stockQuantity}">10</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${p.status.name() == 'ACTIVE' ? 'bg-success' : (p.status.name() == 'REJECTED' ? 'bg-danger' : 'bg-warning text-dark')}"
                                      th:text="${p.status}">ACTIVE</span>
                            </td>
                            <td class="text-end">
                                <div th:if="${p.status.name() == 'PENDING'}" class="d-flex gap-1 justify-content-end">
                                    <form th:action="@{/admin/products/approve/{id}(id=${p.id})}" method="post">
                                        <button type="submit" class="btn btn-sm btn-success rounded-pill px-3"><i class="fa-solid fa-check me-1"></i>Duyệt</button>
                                    </form>
                                    <form th:action="@{/admin/products/reject/{id}(id=${p.id})}" method="post">
                                        <button type="submit" class="btn btn-sm btn-danger rounded-pill px-3"><i class="fa-solid fa-xmark me-1"></i>Từ chối</button>
                                    </form>
                                </div>
                                <div th:if="${p.status.name() != 'PENDING'}">
                                    <a th:href="@{/products/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary rounded-pill px-3"><i class="fa-solid fa-eye me-1"></i>Xem</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <div th:replace="~{layout/main :: footer}"></div>
</body>
</html>
