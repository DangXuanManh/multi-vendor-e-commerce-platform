<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head(${shop.name})}"></head>
<body>
    <div th:replace="~{layout/main :: navbar}"></div>
    <div th:replace="~{layout/main :: alerts}"></div>

    <div class="container main-content mt-4">
        <!-- Shop Header Banner -->
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 bg-white">
            <div class="d-flex align-items-center gap-4">
                <div class="bg-primary text-white rounded-circle p-4 fs-1">
                    <i class="fa-solid fa-store"></i>
                </div>
                <div>
                    <h2 class="fw-bold mb-1 text-slate-900" th:text="${shop.name}">Shop Name</h2>
                    <p class="text-muted mb-2" th:text="${shop.description}">Mô tả gian hàng</p>
                    <div class="d-flex gap-3 text-muted small">
                        <span><i class="fa-solid fa-location-dot me-1 text-danger"></i><span th:text="${shop.address}">Địa chỉ</span></span>
                        <span><i class="fa-solid fa-envelope me-1 text-primary"></i><span th:text="${shop.contactEmail}">Email</span></span>
                        <span><i class="fa-solid fa-phone me-1 text-success"></i><span th:text="${shop.contactPhone}">SĐT</span></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0 text-slate-900"><i class="fa-solid fa-boxes-stacked me-2 text-primary"></i>Sản Phẩm Của Shop (<span th:text="${totalItems}">0</span>)</h4>
            <span class="text-muted small" th:text="'Trang ' + (${currentPage} + 1) + '/' + ${totalPages}">Trang 1/1</span>
        </div>
        
        <div class="row g-4 mb-4">
            <div class="col-6 col-md-4 col-lg-3" th:each="product : ${products}">
                <div class="card card-product h-100 shadow-sm border-0 position-relative" style="cursor: pointer;" th:onclick="'window.location.href=\'/products/' + ${product.id} + '\''">
                    <img th:src="${product.imageUrl}" class="product-img" alt="Product Image">
                    <div class="card-body d-flex flex-column p-3">
                        <h6 class="card-title text-truncate fw-bold mb-1 text-slate-900" th:text="${product.name}">Tên Sản Phẩm</h6>
                        <p class="text-primary fs-5 fw-bold mb-2" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">0đ</p>
                        <div class="mt-auto d-flex gap-2">
                            <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-sm btn-outline-secondary w-50 rounded-pill">Chi tiết</a>
                            <form action="/cart/add" method="post" class="w-50" onclick="event.stopPropagation();">
                                <input type="hidden" name="productId" th:value="${product.id}">
                                <button type="submit" class="btn btn-sm btn-primary w-100 rounded-pill" onclick="event.stopPropagation();"><i class="fa-solid fa-cart-plus me-1"></i>Thêm</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Shop Pagination -->
        <div th:if="${totalPages > 1}" class="d-flex justify-content-center mt-4">
            <nav>
                <ul class="pagination pagination-sm rounded-pill shadow-sm">
                    <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/shops/{id}(id=${shop.id}, page=${currentPage - 1})}">Trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:if="${i >= currentPage - 2 and i <= currentPage + 2}"
                        th:classappend="${currentPage == i ? 'active' : ''}">
                        <a class="page-link" th:href="@{/shops/{id}(id=${shop.id}, page=${i})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/shops/{id}(id=${shop.id}, page=${currentPage + 1})}">Sau</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <div th:replace="~{layout/main :: footer}"></div>
</body>
</html>
